name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  wpf:
    name: Build WPF (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app-final-gagal
            project: app-final-gagal/src/MedievalDesk/MedievalDesk.csproj
            exe: MedievalDesk.exe
          - name: app-desktop
            project: app-desktop/MedievalDesk.Spike/MedievalDesk.Spike.csproj
            exe: MedievalDesk.Spike.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained
        run: >
          dotnet publish ${{ matrix.project }} -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: Self test
        if: matrix.name == 'app-final-gagal'
        shell: pwsh
        run: |
          & "out/${{ matrix.exe }}" --self-test
          if ($LASTEXITCODE -ne 0) { throw "self-test gagal" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "out/*" -DestinationPath "${{ matrix.name }}-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-win-x64
          path: ${{ matrix.name }}-win-x64.zip
          if-no-files-found: error

  tauri:
    name: Build Tauri (prototipe-web)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Build frontend
        run: npm --prefix client run build

      - name: Build Tauri app
        run: npx tauri build --no-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: prototipe-web-win-x64
          path: prototipe-web/src-tauri/target/release/*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [wpf]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-win-x64"
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
